spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  application:
    name: orderflow
  flyway:
    baseline-on-migrate: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: 3600
      refresh-expiration-seconds: 604800
app:
  upload-dir: uploads/products
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}